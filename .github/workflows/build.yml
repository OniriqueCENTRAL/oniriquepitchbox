name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  JUCE_TAG: 9.0.3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            generator: Xcode
            artefacts: build/OniriquePitchBox_artefacts/Release
          - name: Windows
            os: windows-latest
            generator: Visual Studio 17 2022
            artefacts: build/OniriquePitchBox_artefacts/Release

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE and the ARA SDK
        shell: bash
        run: |
          git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git
          git clone --depth 1 https://github.com/Celemony/ARA_SDK.git
          git -C ARA_SDK submodule update --init --depth 1 ARA_API ARA_Library

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "Windows" ]; then
            cmake -B build -G "${{ matrix.generator }}" -A x64
          else
            cmake -B build -G "${{ matrix.generator }}"
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check the macOS binaries are universal
        if: matrix.name == 'macOS'
        run: |
          lipo -info "${{ matrix.artefacts }}/VST3/PitchBox.vst3/Contents/MacOS/PitchBox"
          lipo -info "${{ matrix.artefacts }}/AU/PitchBox.component/Contents/MacOS/PitchBox"

      # Zipped with ditto on macOS so the bundles keep their symlinks and
      # ad-hoc signature, which upload-artifact's own zip would flatten.
      - name: Package (macOS)
        if: matrix.name == 'macOS'
        run: |
          mkdir dist
          ditto -c -k --keepParent "${{ matrix.artefacts }}/VST3/PitchBox.vst3" dist/PitchBox-macOS-VST3.zip
          ditto -c -k --keepParent "${{ matrix.artefacts }}/AU/PitchBox.component" dist/PitchBox-macOS-AU.zip

      - name: Package (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path "${{ matrix.artefacts }}/VST3/PitchBox.vst3" -DestinationPath dist/PitchBox-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PitchBox-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
